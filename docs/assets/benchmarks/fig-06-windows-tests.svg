t (CUL_SKIP_DESKTOP=1 -m &#x27;not</text><text x="32" y="495" fill="#334155" font-size="11">windows_desktop&#x27;) and real WSL2 kali-linux import; compared against historical 0d19a9e (70 tests).</text><text x="32" y="512" fill="#64748B" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Cascadia Code&#x27;, Consolas, monospace" font-size="10.3">Source: benchmark_data.json -&gt; windows_test_suite | research/benchmarks/post-fix-v1/raw/track_d_results.jsonl</text></svg>
