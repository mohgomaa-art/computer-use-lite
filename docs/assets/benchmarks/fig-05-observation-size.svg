#x27;, &#x27;Cascadia Code&#x27;, Consolas, monospace" font-size="14.5" font-weight="700">112 est.</text><text x="706" y="283" fill="#334155" font-size="11.2">min 23, max 664 (harness mean 115.07)</text></g><g transform="translate(38, 328)"><rect x="0" y="0" width="884" height="42" rx="4" fill="#FFFBEB"></rect><rect x="0" y="0" width="3" height="42" rx="1.5" fill="#D97706"></rect><text x="14" y="17" fill="#92400E" font-size="11.8" font-weight="600">NOT ACTUAL PROVIDER BILLING: Do NOT claim a 10.7x total task cost reduction. Multi-turn Codex usage (FIG-03) was +40%</text><text x="14" y="33" fill="#92400E" font-size="11.8" font-weight="600">higher; Explorer uncapped reached 1,611.</text></g><line x1="28" y1="412" x2="932" y2="412" stroke="#E2E8F0" stroke-width="1"></line><text x="32" y="430" fill="#92400E" font-size="11" font-weight="600">Limits: Arabic/non-ASCII UI strings and uncapped dense UIA trees (Explorer 1,611 est.) inflate real BPE token counts sharply.</text><text x="32" y="447" fill="#334155" font-size="11">Methodology: 12 fixtures x 5 headless runs (60 obs; min 23, max 664); round(text_length / 4) vs 46x26 (1,196) grid.</text><text x="32" y="464" fill="#64748B" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Cascadia Code&#x27;, Consolas, monospace" font-size="10.3">Source: benchmark_data.json -&gt; observation_size_comparison | harness_validation.json | benchmarks_real.json</text></svg>
