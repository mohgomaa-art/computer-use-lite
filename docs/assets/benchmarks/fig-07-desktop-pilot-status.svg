dia Code&#x27;, Consolas, monospace" font-size="11.2" font-weight="700">2/2 PASSED</text><text x="154" y="21" fill="#0F172A" font-size="13.5" font-weight="700">CUL Desktop T1 (File Explorer + Archive + Rename)</text><text x="154" y="37" fill="#334155" font-size="11">Two supervised CUL T1 trials reported passing with SHA-256 fixture verification (2 prepare manifests</text><text x="154" y="50" fill="#334155" font-size="11">archived on 2026-11-26T23:41Z &amp; 23:44Z; verify stdout not persisted separately).</text></g><g transform="translate(36, 234)"><rect width="888" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"></rect><rect x="12" y="13" width="126" height="28" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"></rect><text x="75" y="31" text-anchor="middle" fill="#92400E" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Cascadia Code&#x27;, Consolas, monospace" font-size="11.2" font-weight="700">INCOMPLETE</text><text x="154" y="21" fill="#0F172A" font-size="13.5" font-weight="700">CUL Desktop T2 (Explorer + Calculator -&gt; 7006652.txt)</text><text x="154" y="37" fill="#334155" font-size="11">Fixture manifest created (2026-11-26T23:46Z, input.txt 23 B); Calculator workflow and oracle verification</text><text x="154" y="50" fill="#334155" font-size="11">not completed.</text></g><g transform="translate(36, 296)"><rect width="888" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"></rect><rect x="12" y="13" width="126" height="28" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"></rect><text x="75" y="31" text-anchor="middle" fill="#991B1B" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Cascadia Code&#x27;, Consolas, monospace" font-size="11.2" font-weight="700">NOT COMPLETED</text><text x="154" y="21" fill="#0F172A" font-size="13.5" font-weight="700">Native Computer Use vs CUL Head-to-Head</text><text x="154" y="37" fill="#334155" font-size="11">No paired 8-trial Native (@oai/sky) vs CUL desktop benchmark completed. Prior Native Calculator smoke test</text><text x="154" y="50" fill="#334155" font-size="11">was pre-pilot only.</text></g><g transform="translate(36, 366)"><rect width="888" height="122" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"></rect><text x="16" y="22" fill="#065F46" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Cascadia Code&#x27;, Consolas, monospace" font-size="11.5" font-weight="700">VERIFIED WINDOWS UIA AUDIT OBSERVATIONS (@ 0d19a9e):</text><text x="16" y="42" fill="#0F172A" font-size="11.3">• Win32 #32770 Save As dialog commit verified via physical disk SHA-256 match</text><text x="16" y="59" fill="#0F172A" font-size="11.3">• File Explorer inactive-tab controls leak into UIA map with offscreen: false (71 -&gt; 85 elements across 1 -&gt; 2 tabs)</text><text x="16" y="76" fill="#0F172A" font-size="11.3">• Desktop verify_fresh hardcodes occluded: False and invokes across covering windows</text><text x="16" y="93" fill="#0F172A" font-size="11.3">• Win32 PrintWindow horizontally mirrors WS_EX_LAYOUTRTL Arabic test windows</text><text x="16" y="110" fill="#0F172A" font-size="11.3">• show_cursor=True Shadow DOM canvas triggers false full-viewport opaque_canvas (1280x720) blind crop</text></g><line x1="28" y1="485" x2="932" y2="485" stroke="#E2E8F0" stroke-width="1"></line><text x="32" y="503" fill="#92400E" font-size="11" font-weight="600">Limits: Prior Native Calculator smoke check was pre-pilot setup only; do NOT portray desktop benchmarking as complete.</text><text x="32" y="520" fill="#334155" font-size="11">Methodology: Supervised CUL pilot manifests recorded in desktop-pilot-evidence/; standalone Windows audit executed separately on</text><text x="32" y="535" fill="#334155" font-size="11">Win11 at 0d19a9e.</text><text x="32" y="552" fill="#64748B" font-family="&#x27;JetBrains Mono&#x27;, &#x27;Cascadia Code&#x27;, Consolas, monospace" font-size="10.3">Source: benchmark_data.json -&gt; desktop_pilot_status | desktop-pilot-evidence/*.json</text></