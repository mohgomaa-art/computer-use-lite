name: CI

on:
  push:
  pull_request:

jobs:
  test-headless:
    runs-on: windows-latest
    env:
      CUL_SKIP_DESKTOP: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package, test, and benchmark dependencies
        run: python -m pip install -e ".[dev,benchmarks]"

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Compile check
        run: python -m compileall -q src experiments benchmarks tests

      - name: Run non-interactive pytest suite
        run: pytest -v -rs -W error::pytest.PytestReturnNotNoneWarning
