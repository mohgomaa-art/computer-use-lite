[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-lite"
version = "0.2.0a0"
description = "Experimental local-first semantic browser (CDP) and Windows desktop (UIA) interaction engine for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Mohamed Gomaa" }
]
keywords = [
  "computer-use",
  "browser-automation",
  "chrome-devtools-protocol",
  "windows-uiautomation",
  "mcp",
  "accessibility-tree",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "playwright>=1.40",
  "pillow>=10.0",
  "websockets>=14.0",
  "mcp>=1.25.0,<2",
  "uiautomation>=2.0.29; sys_platform == 'win32'",
  "comtypes>=1.5.0; sys_platform == 'win32'",
]

[project.scripts]
computer-use-lite-mcp = "computer_use_lite.mcp_server:main"

[project.urls]
Homepage = "https://github.com/mohgomaa-art/computer-use-lite"
Repository = "https://github.com/mohgomaa-art/computer-use-lite"
Issues = "https://github.com/mohgomaa-art/computer-use-lite/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "tomlkit>=0.12",
  "psutil>=6.0",
]
benchmarks = [
  "websockets>=14.0",
  "psutil>=6.0",
]
setup = [
  "tomlkit>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "windows_desktop: requires an active interactive Windows desktop session (skipped on non-Windows or when CUL_SKIP_DESKTOP=1)",
  "windows_only: requires Windows Win32/UIA COM APIs without an interactive desktop session (skipped on non-Windows)",
]
